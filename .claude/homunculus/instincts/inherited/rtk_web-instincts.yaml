# Rtk_web Workflow Voucher Feature Workflow

## Action

Follow the voucher-feature-workflow workflow:
1. Create or update voucher-related documentation in docs/ (voucher_system.md, CAP_NHAT_PAYMENT_SELECTED_PROVINCES.md, etc.)
2. Create or update migration in db/migrations/ (e.g., *_add_temp_phone_to_survey_account.sql, migration_add_selected_provinces.sql)
3. Update or add PHP logic in private/action/purchase/ (apply_voucher.php, process_order.php, remove_voucher.php, etc.)
4. Update or add helper utilities in private/utils/ (device_voucher_helper.php, selected_provinces_helper.php)
5. Update or add PHP classes in private/classes/ (Voucher.php, purchase/PaymentService.php)
6. Update error logging in private/logs/error.log
7. Update frontend JS and CSS in public/assets/js/pages/purchase/ and public/assets/css/pages/purchase/
8. Update frontend pages in public/pages/purchase/

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: docs/*voucher*.md, db/migrations/*voucher*.sql, private/action/purchase/apply_voucher.php

