# Rtk_web Workflow Auth Otp Feature Workflow

## Action

Follow the auth-otp-feature-workflow workflow:
1. Create or update migration in db/migrations/ (e.g., *_add_otp_verification.sql)
2. Update or add PHP logic in private/action/auth/ (process_*, resend-*, verify-*)
3. Update helper utilities in private/utils/ (email_helper.php, otp_helper.php, sms_helper.php)
4. Update or add documentation in docs/doc_for_user/otp_authentication.md
5. Update frontend pages in public/pages/auth/ (forgot_password.php, new_password.php, reset-password-otp.php, verify-email-otp.php)
6. Update CSS in public/assets/css/home.css
7. Update handler logic in public/handlers/action_handler.php
8. Update homepage if needed

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: db/migrations/*otp*.sql, private/action/auth/*otp*.php, private/utils/email_helper.php

